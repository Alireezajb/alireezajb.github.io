<section class="wrap projects" aria-labelledby="projects-title">
  <header class="heading">
    <p class="eyebrow">نمونه‌کارهای منتخب</p>
    <h1 id="projects-title">چند پروژه، چند مسئلهٔ واقعی.</h1>
    <p class="intro">هر پروژه، پاسخی به یک نیاز واقعی.</p>
  </header>
  <div class="grid">
    @for (project of projects; track project.id) {
      <app-project-card class="catalog-card" [project]="project" [small]="true" />
    }
  </div>
</section>
