<section class="hero wrap" id="home" aria-labelledby="hero-title">
  <div class="hero-main">
    <div class="hero-copy">
      <h1 id="hero-title">پشت هر تجربهٔ خوب،<br>یک ساختِ درست است.</h1>
      <p class="hero-intro">از یک ایده تا محصولی که هر روز به کارتان می‌آید؛ وب‌سایت و نرم‌افزاری می‌سازم که با نیاز کسب‌وکارتان رشد کند.</p>
      <div class="actions">
        <a pButton [unstyled]="true" class="button primary" routerLink="/" fragment="work">کارهایی که ساخته‌ام <i class="pi pi-arrow-left" aria-hidden="true"></i></a>
        <a pButton [unstyled]="true" class="button secondary" routerLink="/" fragment="collaboration">دربارهٔ همکاری</a>
      </div>
    </div>
    <app-hero-art />
  </div>
  <div class="hero-bottom">
    <div class="hero-proof" aria-label="تجربه و پروژه‌ها">
      <div class="proof-metric"><strong dir="ltr">6<span>+</span></strong><span>سال تجربهٔ حرفه‌ای</span></div>
      <div class="proof-metric"><strong dir="ltr">3<span>+</span></strong><span>سال سابقهٔ ارشد وب</span></div>
      <div class="proof-metric"><strong dir="ltr">18<span>+</span></strong><span>پروژهٔ تحویل‌شده</span></div>
    </div>
  </div>
</section>
